# ImmortalWrt 25.12 · Globitel BT-R320（MT7981B / eMMC FIT）单机型编译
#
# 机型支持来自 25.12 上游源码树本身（DTS / U-Boot / 02_network / platform.sh /
# uboot-envtools 均已具备），由 .github/scripts/bt-r320-inject.sh 做定制与硬校验。
# 已确认上游修复齐全：root=/dev/fit0 + GPT production rootdisk、CPU 端口 2500base-x、
# U-Boot 2.5G 以太网修复、factory 分区 WiFi 校准 eeprom、WiFi MAC 热插拔。
#
# 机器性质：eMMC FIT，只产 *-squashfs-sysupgrade.itb（写 production FIT 容器），
#   不产 factory；preloader / fip / gpt 一律不进 Release，沿用机器现有引导。
#
# 界面：argon 主题 + iStore 软件中心 + 强制简体中文（中文包 + zh_cn）。
# 无线：kmod-mt7915e + mt7981-wo-firmware + 首启 99-wifi-boost（CN / HE160 / HE40 /
#   802.11k/v/r / beamformee），并落位双频 AP 配置，LuCI「网络-无线」可见且首启开启。
#
# 定时：每周一 08:10（北京时间），与其它固件 workflow 同时段。
name: ImmortalWrt 25.12 · Globitel BT-R320 (eMMC)

on:
  schedule:
    # UTC 周一 00:10 = 北京周一 08:10
    - cron: '10 0 * * 1'
  workflow_dispatch:
    inputs:
      make_release:
        description: '编译完成后发布 Release'
        type: boolean
        default: true
  push:
    branches: [master]
    paths:
      - '.github/workflows/immortalwrt-globitel-bt-r320.yml'
      - '.github/scripts/bt-r320-inject.sh'
permissions:
  contents: write

concurrency:
  group: immortalwrt-globitel-bt-r320
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  NAND_FULL: ""
  SYSUP_ONLY: "globitel_bt-r320"
  EXPECTED_N: "1"
  TAG_PREFIX: immortalwrt-25.12-globitel-bt-r320
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 1500M
  CCACHE_COMPRESS: 'true'
  CCACHE_NOHASHDIR: 'true'

jobs:
  build:
    name: 🏗️ Globitel BT-R320 (eMMC FIT)
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 释放磁盘空间并加大 swap
        run: |
          echo "===== 释放前 ====="
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/lib/jvm \
                      /usr/share/swift /usr/share/miniconda /usr/share/rust \
                      /usr/share/kotlinc /usr/share/gradle-* /opt/az \
                      /opt/microsoft /usr/local/aws-cli /usr/local/.ghcup \
                      /etc/mysql /etc/php /usr/local/go /opt/pipx 2>/dev/null || true
          sudo systemctl stop docker docker.socket containerd 2>/dev/null || true
          sudo rm -rf /var/lib/docker /var/lib/containerd 2>/dev/null || true
          sudo pkill -9 -f dockerd 2>/dev/null || true
          sudo pkill -9 -f containerd 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/* 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          sudo rm -rf /snap /var/lib/snapd 2>/dev/null || true
          sudo journalctl --vacuum-size=32M 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true
          if sudo fallocate -l 4G /swapfile 2>/dev/null; then
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile >/dev/null 2>&1 && sudo swapon /swapfile && echo ">>> swap 4G 已启用"
          else
            echo "::warning::swap 创建失败，继续（大内存 package 可能有风险）"
          fi
          echo "===== 释放后 ====="
          df -h / | tail -1
          free -h

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -qq -o Acquire::Retries=3 || sudo -E apt-get update -qq
          for i in 1 2 3; do
            if timeout 1500 sudo -E apt-get install -y --no-install-recommends \
              ack antlr3 asciidoc autoconf automake autopoint binutils bison \
              build-essential bzip2 ccache clang cmake cpio curl \
              device-tree-compiler flex gawk gcc-multilib g++-multilib \
              genisoimage gettext git gperf haveged help2man intltool \
              libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
              libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
              libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
              libssl-dev libtool libxslt1-dev lld llvm lrzsz msmtp ninja-build \
              p7zip p7zip-full patch pkgconf python3 python3-pyelftools \
              python3-setuptools qemu-utils rsync scons squashfs-tools \
              subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto \
              xxd zlib1g-dev; then
              echo ">>> 依赖安装完成"
              break
            fi
            echo ">>> 第 $i 次安装失败，30 秒后重试"
            sleep 30
          done
          ccache --version | head -1 || echo "::warning::ccache 不可用，本次不启用缓存"

      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-globitel-bt-r320-${{ github.run_id }}
          restore-keys: |
            ccache-globitel-bt-r320-
            ccache-filogic-

      - name: 注入 BT-R320 定制（iStore / 中文 / 双频 WiFi / 上游支持校验）
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bt-r320-inject.sh"

      - name: 更新并安装 feeds（含 iStore 市场）
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/vendor.sh" feed
          for i in 1 2 3; do
            if ./scripts/feeds update -a && ./scripts/feeds install -a; then
              echo ">>> feeds 完成"
              break
            fi
            echo ">>> 第 $i 次 feeds 失败，20 秒后重试"
            rm -rf feeds
            sleep 20
            [ "$i" = "3" ] && exit 1
          done
          bash "$GITHUB_WORKSPACE/.github/scripts/vendor.sh" store
          bash "$GITHUB_WORKSPACE/.github/scripts/vendor.sh" theme
          bash "$GITHUB_WORKSPACE/.github/scripts/vendor.sh" collections

      - name: 修补 libffi InstallDev（删除失效的 fficonfig.h 硬拷，对齐官方 25.12）
        shell: bash
        run: |
          f=feeds/packages/libs/libffi/Makefile
          if [ ! -f "$f" ]; then echo ">>> 无 $f，跳过"; exit 0; fi
          if ! grep -qF 'fficonfig.h' "$f"; then
            echo ">>> libffi InstallDev 无 fficonfig.h 拷贝，无需处理"; exit 0
          fi
          python3 - "$f" <<'PY'
          import re, sys

          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          pats = [
              re.compile(r"\t\$\(CP\) \\\n\t\t\$\(PKG_BUILD_DIR\)/\$\(GNU_TARGET_NAME\)\*/fficonfig\.h \\\n\t\t\$\(1\)/usr/include/\n"),
              re.compile(r"\t@ffi=[^\n]*\\\n\tif \[ -n \"\$+ffi\" \]; then[^\n]*\\\n\telse echo [^\n]*\n"),
          ]
          n = 0
          for pat in pats:
              s, k = pat.subn("", s)
              n += k
          if n == 0:
              print("SKIP: 未匹配到任何 fficonfig.h 拷贝段")
              sys.exit(1)
          open(p, "w", encoding="utf-8").write(s)
          print("PATCHED: 删除了 %d 段 fficonfig.h 拷贝" % n)
          PY
          echo "---- 修补后的 Build/InstallDev ----"
          sed -n '/define Build\/InstallDev/,/^endef/p' "$f"
          exit 0

      - name: 生成 .config（只有本机型 + argon + iStore + 强制中文 + 无线）
        run: |
          set -euo pipefail
          DEV_LIST="$NAND_FULL $SYSUP_ONLY"
          : > .config
          cat >> .config <<'CFG'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_PER_DEVICE_ROOTFS=y
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          CONFIG_PACKAGE_libmbedtls=y
          CONFIG_PACKAGE_libustream-mbedtls=y
          # CONFIG_SIGNED_PACKAGES is not set
          # CONFIG_SIGNATURE_CHECK is not set
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-i18n-store-zh-cn=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_kmod-mt7915e=y
          CFG
          sed -i 's/^          //' .config
          bash "$GITHUB_WORKSPACE/.github/scripts/vendor.sh" config .config
          make defconfig

          python3 - $DEV_LIST <<'PY'
          import sys
          keeps = {'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_' + x for x in sys.argv[1:]}
          off, out = [], []
          for line in open('.config', encoding='utf-8', errors='surrogateescape'):
              name = line.split('=')[0].replace('# ', '').split(' ')[0]
              if name.startswith('CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_') and name not in keeps:
                  off.append(name)
                  continue
              out.append(line)
          for n in dict.fromkeys(off):
              out.append('# %s is not set\n' % n)
          for n in sorted(keeps):
              out.append('%s=y\n' % n)
          open('.config', 'w', encoding='utf-8', errors='surrogateescape').writelines(out)
          print('已关闭非目标机型: %d 个；保留 %d 台' % (len(off), len(keeps)))
          PY
          echo "CONFIG_TARGET_MULTI_PROFILE=y" >> .config
          make defconfig

          awk '/^[[:space:]]*config PACKAGE_luci-i18n-.+-zh-cn$/{print "CONFIG_"$2"=y"}' tmp/.config-package.in >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          make defconfig

          bash "$GITHUB_WORKSPACE/.github/scripts/vendor.sh" uci-defaults

          echo "===== 校验 ====="
          grep -q '^CONFIG_TARGET_mediatek=y$' .config || { echo "::error::target 未选中"; exit 1; }
          grep -q '^CONFIG_TARGET_mediatek_filogic=y$' .config || { echo "::error::subtarget filogic 未选中"; exit 1; }
          grep -q '^CONFIG_TARGET_MULTI_PROFILE=y$' .config || { echo "::error::MULTI_PROFILE 被丢弃"; exit 1; }
          for d in $DEV_LIST; do
            grep -q "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${d}=y$" .config || { echo "::error::机型 ${d} 未生效"; exit 1; }
          done
          n_dev=$(grep -cE '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' .config || true)
          [ "${n_dev:-0}" -eq 1 ] || { echo "::error::启用机型应为 1 台，实际 ${n_dev}"; grep -E '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' .config; exit 1; }
          grep -q '^CONFIG_PACKAGE_luci-theme-argon=y$' .config || { echo "::error::argon 主题未启用"; exit 1; }
          grep -q '^CONFIG_LUCI_LANG_zh_Hans=y$' .config || { echo "::error::LUCI_LANG_zh_Hans 未生效"; exit 1; }
          grep -q "luci.main.lang='zh_cn'" files/etc/uci-defaults/99-luci-lang-zh-cn || { echo "::error::默认语言不是简体中文"; exit 1; }
          grep -q "luci.main.mediaurlbase='/luci-static/argon'" files/etc/uci-defaults/99-luci-theme-argon || { echo "::error::默认主题不是 argon"; exit 1; }
          grep -q "CONFIG_SIGNED_PACKAGES is not set" .config || { echo "::error::包索引签名未关闭"; exit 1; }

          # ---- 本机型专属：DEVICE_PACKAGES 必须带 iStore / 中文 / WiFi ----
          python3 - <<'PY'
          s = open('target/linux/mediatek/image/filogic.mk', encoding='utf-8').read()
          b = s[s.index('define Device/globitel_bt-r320'):s.index('TARGET_DEVICES += globitel_bt-r320')]
          for p in ('luci-app-store', 'luci-i18n-base-zh-cn', 'kmod-mt7915e',
                    'kmod-mt7981-firmware', 'mt7981-wo-firmware'):
              assert p in b, 'BT-R320 DEVICE_PACKAGES 缺少: ' + p
          print('✔ BT-R320 DEVICE_PACKAGES 校验通过')
          PY

          # ---- 网络与无线硬断言（确认「网络-无线」里真的有双频且首启开启） ----
          grep -q 'globitel,bt-r320' target/linux/mediatek/filogic/base-files/etc/board.d/02_network \
            || { echo "::error::02_network 缺 BT-R320 网口分配"; exit 1; }
          grep -q 'globitel,bt-r320' target/linux/mediatek/filogic/base-files/etc/hotplug.d/ieee80211/11_fix_wifi_mac \
            || { echo "::error::BT-R320 WiFi MAC 热插拔缺失"; exit 1; }
          grep -q 'eeprom_factory_0' target/linux/mediatek/dts/mt7981b-globitel-bt-r320.dts \
            || { echo "::error::BT-R320 DTS 缺 WiFi 校准 eeprom"; exit 1; }
          grep -q 'root=/dev/fit0' target/linux/mediatek/dts/mt7981b-globitel-bt-r320.dts \
            || { echo "::error::BT-R320 DTS 缺 FIT 启动参数"; exit 1; }
          test -f files/etc/config/wireless || { echo "::error::无线配置文件缺失"; exit 1; }
          grep -q "option path 'platform/soc/18000000.wifi'" files/etc/config/wireless || { echo "::error::缺 2.4G radio"; exit 1; }
          grep -q "option path 'platform/soc/18000000.wifi+1'" files/etc/config/wireless || { echo "::error::缺 5G radio"; exit 1; }
          grep -q "option ssid 'BT-R320-2.4G'" files/etc/config/wireless || { echo "::error::缺 2.4G AP"; exit 1; }
          grep -q "option ssid 'BT-R320-5G'" files/etc/config/wireless || { echo "::error::缺 5G AP"; exit 1; }
          grep -q "option disabled '0'" files/etc/config/wireless || { echo "::error::无线仍为 disabled"; exit 1; }
          test -f files/etc/uci-defaults/99-wifi-boost || { echo "::error::无线增强脚本缺失"; exit 1; }
          grep -q "country='CN'" files/etc/uci-defaults/99-wifi-boost || { echo "::error::无线国码不是 CN"; exit 1; }
          grep -q 'HE160' files/etc/uci-defaults/99-wifi-boost || { echo "::error::5G 未开 HE160"; exit 1; }
          grep -q "ieee80211r='1'" files/etc/uci-defaults/99-wifi-boost || { echo "::error::未开 802.11r"; exit 1; }
          echo "机型: ${DEV_LIST} / 主题: argon / iStore + 中文 / 双频无线: 首启开启 + wifi-boost"

      - name: 下载源码包
        run: |
          for i in 1 2 3; do
            if make -j8 download < /dev/null; then
              echo ">>> 下载完成"
              break
            fi
            echo ">>> 第 $i 次下载有失败项，重试"
            sleep 15
          done
          make -j1 download < /dev/null 2>&1 | tail -20 || true

      - name: 编译固件
        run: |
          export CCACHE_DIR CCACHE_MAXSIZE CCACHE_COMPRESS CCACHE_NOHASHDIR
          mkdir -p "$CCACHE_DIR"
          ccache -s 2>/dev/null || true
          set -o pipefail
          echo ">>> 并行编译 make -j$(nproc)"
          if make -j"$(nproc)" 2>&1 | tee build.log; then
            echo ">>> ✅ 编译成功"
          else
            echo "::warning::并行编译失败，改用单线程 V=s 复现真实错误"
            make -j1 V=s 2>&1 | tee -a error.log || true
            echo "===== error.log 尾部 150 行 ====="
            tail -150 error.log || true
            ccache -s 2>/dev/null || true
            exit 1
          fi
          ccache -s 2>/dev/null || true

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-globitel-bt-r320
          path: |
            build.log
            error.log
            .config
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

      - name: 收集产物（BT-R320 eMMC FIT：只收 sysupgrade.itb）
        id: collect
        run: |
          set -euo pipefail
          B=bin/targets/mediatek/filogic
          mkdir -p out
          shopt -s nullglob
          ALL="$NAND_FULL $SYSUP_ONLY"
          for d in $ALL; do
            for f in "$B"/*"${d}"-squashfs-sysupgrade.itb; do
              cp -f "$f" out/
            done
          done
          echo "===== bin/targets 下本批机型文件 ====="
          for d in $ALL; do ls -lh "$B"/*"${d}"* 2>/dev/null || true; done
          echo "===== out/ ====="
          ls -lh out || true

          for d in $SYSUP_ONLY; do
            factory=( out/*"${d}"-squashfs-factory.* )
            sysup=( out/*"${d}"-squashfs-sysupgrade.itb )
            [ "${#factory[@]}" -eq 0 ] || { echo "::error::${d} 不该有 factory 产物"; ls out; exit 1; }
            [ "${#sysup[@]}" -ge 1 ] || { echo "::error::${d} 缺 sysupgrade.itb（FIT）"; ls out; exit 1; }
          done
          n=$(ls -1 out | wc -l)
          [ "$n" -eq "${EXPECTED_N}" ] || { echo "::error::应产出 ${EXPECTED_N} 个固件，实际 $n"; ls out; exit 1; }
          # 引导工件硬性拒绝：BT-R320 只发 FIT sysupgrade，preloader/fip/gpt/recovery 一律不发
          if ls out/ | grep -qiE 'preloader|bl31|\.fip$|gpt|initramfs|recovery'; then
            echo "::error::产物里出现引导工件，拒绝发布"; ls out; exit 1
          fi
          (cd out && sha256sum ./* > sha256sums.txt)
          {
            echo "## 🏗️ Globitel BT-R320 (eMMC FIT) 编译完成"
            echo ""
            echo "| 文件 | 大小 |"
            echo "|---|---|"
            ls -lh out | tail -n +2 | awk '{printf "| %s | %s |\n", $9, $5}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: images-globitel-bt-r320
          path: out/
          retention-days: 14
          if-no-files-found: error

      - name: 发布 Release
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.make_release != false) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          DATE=$(TZ=Asia/Shanghai date +%Y%m%d)
          TAG="${TAG_PREFIX}-${DATE}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::${TAG} 已存在（同日重跑），改用 r${GITHUB_RUN_NUMBER} 后缀"
            TAG="${TAG}-r${GITHUB_RUN_NUMBER}"
          fi
          cat > notes.md <<'EOF'
          ImmortalWrt 25.12 · Globitel BT-R320（MT7981B / eMMC）自动编译

          - 源码: 本仓库 `master`（ImmortalWrt 25.12 上游机型支持 + 本仓库定制）
          - 机型: `globitel_bt-r320`（eMMC FIT，仅 sysupgrade）
          - 产物: 只有 `*-squashfs-sysupgrade.itb`（FIT 容器，写 production 分区）
          - 引导: **沿用机器现有 U-Boot**；本页不含 preloader / fip / gpt
          - 上游修复: FIT root=/dev/fit0 + GPT production rootdisk、CPU 端口 2500base-x、U-Boot 2.5G 以太网、factory WiFi 校准、WiFi MAC 热插拔
          - 界面: argon 主题 + iStore 软件市场 + 强制简体中文（默认语言 zh_cn）
          - 无线: mt7915e + mt7981-wo-firmware；首启双频 AP（`BT-R320-2.4G` / `BT-R320-5G`）自动开启
          - 无线增强: 国码 CN / 5G HE160 / 2.4G HE40 / 802.11k v r / beamformee
          - 默认 IP: 192.168.1.1 / 用户名 root / 无密码
          - 定时: 每周一 08:10（北京时间）自动编译
          - 工作流: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### 刷机提示

          1. 已是 OpenWrt/ImmortalWrt 且 U-Boot 兼容：系统内直接刷 `*-squashfs-sysupgrade.itb`
          2. 从原厂固件首次刷入：需先备分区并按上游说明刷 GPT + U-Boot，再用 U-Boot 刷本 itb；本页不提供引导工件
          3. 无线首启即开启；如布署 802.11r，请把各 AP 的 mobility_domain 设为一致
          EOF
          for i in 1 2 3 4 5; do
            echo ">>> 第 $i 次上传"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" --title "ImmortalWrt 25.12 · Globitel BT-R320 ${DATE}" --notes-file notes.md || true
            fi
            if gh release upload "$TAG" out/* --clobber; then
              echo ">>> 上传成功（第 $i 次）"
              exit 0
            fi
            echo ">>> 第 $i 次失败，$((i*30)) 秒后重试"
            sleep $((i*30))
          done
          echo "::error::Release 资产上传失败（多为 GitHub 二次限流），产物已保留在 Actions artifact 里"
          exit 1
